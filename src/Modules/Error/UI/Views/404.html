<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur 404 — Page introuvable</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f4f0;
            color: #2c2c2a;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            text-align: center;
            max-width: 520px;
            width: 100%;
        }

        .code {
            font-size: clamp(64px, 15vw, 96px);
            font-weight: 500;
            color: #888780;
            letter-spacing: -3px;
            line-height: 1;
            margin-bottom: 0.25rem;
        }

        .label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #b4b2a9;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: clamp(18px, 4vw, 22px);
            font-weight: 500;
            color: #2c2c2a;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        p {
            font-size: 15px;
            color: #5f5e5a;
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: opacity 0.15s;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: #2c2c2a;
            color: #f1efe8;
        }

        .btn-secondary {
            background: transparent;
            color: #5f5e5a;
            border: 0.5px solid #b4b2a9;
        }

        .footer {
            font-size: 12px;
            color: #b4b2a9;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1a1a18;
                color: #f1efe8;
            }

            h1 {
                color: #f1efe8;
            }

            .code {
                color: #5f5e5a;
            }

            .btn-primary {
                background: #f1efe8;
                color: #2c2c2a;
            }

            .btn-secondary {
                color: #b4b2a9;
                border-color: #444441;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="code">404</div>
        <div class="label">Page introuvable</div>

        <h1>Cette page n'existe pas</h1>
        <p>
            L'adresse que vous avez saisie est incorrecte ou la page a été déplacée.<br>
            Vérifiez l'URL ou revenez à l'accueil.
        </p>

        <div class="actions">
            <a href="/" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
                Retour à l'accueil
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="15 18 9 12 15 6" />
                </svg>
                Page précédente
            </a>
        </div>

        <p class="footer">
            Si vous pensez qu'il s'agit d'une erreur, contactez l'administrateur.
        </p>
    </div>
</body>

</html>
